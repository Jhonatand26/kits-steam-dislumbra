[project]
name = "informe"
version = "0.1.0"
description = "Genera el informe PDF de faltantes a partir de los datos del repo."
readme = "README.md"
authors = [{ name = "Jhonatan" }]
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.14.3",
]

[project.scripts]
informe = "informe.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72
